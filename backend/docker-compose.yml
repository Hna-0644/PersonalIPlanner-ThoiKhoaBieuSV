version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: planner_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}"
      MYSQL_DATABASE: personal_planner
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: planner_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  mysql_data: